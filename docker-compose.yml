version: "3.9"

# =============================================================================
# AI VIDEO STUDIO — Infrastructure Services
# Only PostgreSQL and Redis run in Docker.
# Python backend and Next.js frontend run natively for Apple Silicon compatibility.
# =============================================================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: videostudio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: videostudio
      POSTGRES_PASSWORD: videostudio
      POSTGRES_DB: videostudio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videostudio -d videostudio"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: videostudio-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

