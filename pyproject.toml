[tool.poetry]
name = "ai-video-studio"
version = "0.1.0"
description = "Local AI Video Production Studio"
authors = ["Local AI Video Studio"]
python = "^3.11"

[tool.poetry.dependencies]
python = "^3.11"

# Web Framework
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
python-multipart = "^0.0.12"

# Database
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
alembic = "^1.13.0"

# Validation
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
email-validator = "^2.2.0"

# Security
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
cryptography = "^43.0.0"

# Task Queue
celery = {extras = ["redis"], version = "^5.4.0"}
redis = "^5.2.0"

# HTTP Client
httpx = "^0.27.0"
aiofiles = "^24.1.0"

# AI Provider SDKs
google-generativeai = "^0.8.0"
groq = "^0.11.0"
openai = "^1.45.0"     # ElevenLabs compatible
replicate = "^0.31.0"

# Media Processing
ffmpeg-python = "^0.2.0"

# Speech (Local)
faster-whisper = "^1.0.0"
TTS = "^0.22.0"        # Coqui TTS

# Image Processing
Pillow = "^10.4.0"
numpy = "^1.26.0"

# Utilities
python-dotenv = "^1.0.0"
structlog = "^24.4.0"
tenacity = "^9.0.0"
rich = "^13.8.0"
psutil = "^6.1.0"
click = "^8.1.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-mock = "^3.14.0"
httpx = "^0.27.0"
black = "^24.8.0"
ruff = "^0.6.0"
mypy = "^1.11.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

